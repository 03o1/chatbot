<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anas Chat - Admin Control Panel</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #030712; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }

        #adminAuth { position: fixed; inset: 0; background: #020617; display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .login-card { background: #111827; border: 1px solid #1f2937; padding: 30px; border-radius: 14px; width: 100%; max-width: 380px; text-align: center; }
        .login-card h2 { color: #38bdf8; margin-bottom: 6px; }
        .login-card p { color: #9ca3af; font-size: 13px; margin-bottom: 20px; }
        .input-box { width: 100%; background: #030712; border: 1px solid #374151; color: white; padding: 11px; border-radius: 8px; margin-bottom: 12px; outline: none; }
        .btn-main { width: 100%; background: #0284c7; color: white; border: none; padding: 11px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .err { color: #f87171; font-size: 12px; margin-top: 8px; }

        header { background: #111827; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937; }
        .logo { font-size: 18px; font-weight: 800; color: #38bdf8; }
        .admin-badge { background: #ef4444; color: white; font-size: 10px; padding: 3px 8px; border-radius: 4px; font-weight: bold; }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 16px; width: 100%; flex: 1; }
        .section-title { font-size: 18px; font-weight: bold; margin-bottom: 12px; color: #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 24px; }
        .stat-card { background: #111827; border: 1px solid #1f2937; padding: 18px; border-radius: 10px; text-align: center; }
        .stat-val { font-size: 24px; font-weight: bold; color: #38bdf8; margin-top: 4px; }

        .table-wrap { background: #111827; border: 1px solid #1f2937; border-radius: 10px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; min-width: 500px; }
        th, td { padding: 12px 16px; border-bottom: 1px solid #1f2937; }
        th { background: #1f2937; color: #cbd5e1; }
        .del-btn { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; }
    </style>
</head>
<body>

<div id="adminAuth">
    <div class="login-card">
        <h2>ADMIN PORTAL</h2>
        <p>Anas Chat Secure Management</p>
        <input type="text" id="adminId" class="input-box" placeholder="Admin ID (anas_admin_99)">
        <input type="password" id="adminPass" class="input-box" placeholder="Password">
        <button class="btn-main" onclick="adminLogin()">Login to Dashboard</button>
        <div class="err" id="loginErr"></div>
    </div>
</div>

<header>
    <div class="logo">ANAS CHAT <span class="admin-badge">ADMIN CONTROL</span></div>
    <button class="del-btn" onclick="adminLogout()">Logout</button>
</header>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card">
            <div>Total Registered Users</div>
            <div class="stat-val" id="totalUsersCount">0</div>
        </div>
    </div>

    <div class="section-title">All Registered Users</div>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Username ID</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            Ref>
            <tbody id="usersTableBody">
                <tr><td colspan="4" style="text-align:center; color:#9ca3af;">Loading database...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyD5FeFjoZOgy5gauNMyogwvsdQHcYGvSEc",
      authDomain: "anaschatdb-6e0af.firebaseapp.com",
      projectId: "anaschatdb-6e0af",
      storageBucket: "anaschatdb-6e0af.firebasestorage.app",
      messagingSenderId: "51927735471",
      appId: "1:51927735471:web:5d95993d3979730c9d485a",
      measurementId: "G-VTFCGDT9KB"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let isAdminLoggedIn = localStorage.getItem('anas_admin_logged') === 'true';

    window.onload = () => {
        if (isAdminLoggedIn) {
            document.getElementById('adminAuth').style.display = 'none';
            fetchAdminData();
        }
    };

    async function adminLogin() {
        const id = document.getElementById('adminId').value.trim();
        const pass = document.getElementById('adminPass').value.trim();
        const err = document.getElementById('loginErr');

        if (id === 'anas_admin_99' && pass === 'anas1234') {
            localStorage.setItem('anas_admin_logged', 'true');
            document.getElementById('adminAuth').style.display = 'none';
            fetchAdminData();
        } else {
            err.innerText = 'Galat Admin ID ya Password!';
        }
    }

    function adminLogout() {
        localStorage.removeItem('anas_admin_logged');
        location.reload();
    }

    function fetchAdminData() {
        db.collection('users').onSnapshot(snapshot => {
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';
            let count = 0;

            snapshot.forEach(doc => {
                const u = doc.data();
                if (doc.id === 'anas_admin_99') return; // Skip admin itself
                count++;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${u.name || 'N/A'}</td>
                    <td>@${u.id}</td>
                    <td><span style="color:${u.status === 'online' ? '#10b981' : '#9ca3af'}">${u.status || 'offline'}</span></td>
                    <td><button class="del-btn" onclick="deleteUser('${u.id}')">Delete</button></td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('totalUsersCount').innerText = count;
            if (count === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#9ca3af;">Koi user mojood nahi hai.</td></tr>`;
            }
        });
    }

    async function deleteUser(userId) {
        if (confirm(`Kya aap waqai user @${userId} ko delete karna chahte hain?`)) {
            try {
                await db.collection('users').doc(userId).delete();
                alert('User delete ho gaya!');
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
    }
</script>
</body>
</html>
