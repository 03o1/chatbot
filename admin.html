<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anas Social - Admin Control Panel</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #030712; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }

        #adminAuth { position: fixed; inset: 0; background: #020617; display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .login-card { background: #111827; border: 1px solid #1f2937; padding: 30px; border-radius: 14px; width: 100%; max-width: 380px; text-align: center; }
        .input-box { width: 100%; background: #030712; border: 1px solid #374151; color: white; padding: 11px; border-radius: 8px; margin-bottom: 12px; outline: none; }
        .btn-main { width: 100%; background: #0284c7; color: white; border: none; padding: 11px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        header { background: #111827; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 16px; width: 100%; flex: 1; }
        .section-title { font-size: 18px; font-weight: bold; margin-bottom: 12px; color: #e2e8f0; margin-top: 24px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 24px; }
        .stat-card { background: #111827; border: 1px solid #1f2937; padding: 18px; border-radius: 10px; text-align: center; }
        .stat-val { font-size: 24px; font-weight: bold; color: #38bdf8; margin-top: 4px; }

        .table-wrap { background: #111827; border: 1px solid #1f2937; border-radius: 10px; overflow-x: auto; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; min-width: 600px; }
        th, td { padding: 12px 16px; border-bottom: 1px solid #1f2937; }
        th { background: #1f2937; color: #cbd5e1; }
        .del-btn { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; }
        .rank-btn { background: #f59e0b; color: #020617; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; margin-right: 5px; }
    </style>
</head>
<body>

<div id="adminAuth">
    <div class="login-card">
        <h2 style="color:#38bdf8; margin-bottom:10px;">ADMIN PORTAL</h2>
        <input type="text" id="adminId" class="input-box" placeholder="Admin ID (anas_admin_99)">
        <input type="password" id="adminPass" class="input-box" placeholder="Password (anas1234)">
        <button class="btn-main" onclick="adminLogin()">Login</button>
        <div id="loginErr" style="color:#f87171; font-size:12px; margin-top:8px;"></div>
    </div>
</div>

<header>
    <div style="font-weight:bold; color:#38bdf8;">ANAS SOCIAL ADMIN</div>
    <button class="del-btn" onclick="localStorage.removeItem('anas_admin_logged'); location.reload();">Logout</button>
</header>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card"><div>Total Users</div><div class="stat-val" id="totalUsers">0</div></div>
        <div class="stat-card"><div>Total Posts</div><div class="stat-val" id="totalPosts">0</div></div>
    </div>

    <div class="section-title">All Registered Users</div>
    <div class="table-wrap">
        <table>
            <thead><tr><th>Name</th><th>ID</th><th>Status</th><th>Action</th></tr></thead>
            <tbody id="usersTable"></tbody>
        </table>
    </div>

    <div class="section-title">All Community Posts & High Ranking Control</div>
    <div class="table-wrap">
        <table>
            <thead><tr><th>Author</th><th>Content</th><th>Rank Status</th><th>Actions</th></tr></thead>
            <tbody id="postsTable"></tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyD5FeFjoZOgy5gauNMyogwvsdQHcYGvSEc",
      authDomain: "anaschatdb-6e0af.firebaseapp.com",
      projectId: "anaschatdb-6e0af",
      storageBucket: "anaschatdb-6e0af.firebasestorage.app",
      messagingSenderId: "51927735471",
      appId: "1:51927735471:web:5d95993d3979730c9d485a",
      measurementId: "G-VTFCGDT9KB"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    if(localStorage.getItem('anas_admin_logged') === 'true') {
        document.getElementById('adminAuth').style.display = 'none';
        loadAdminData();
    }

    function adminLogin() {
        const id = document.getElementById('adminId').value.trim();
        const pass = document.getElementById('adminPass').value.trim();
        if(id === 'anas_admin_99' && pass === 'anas1234') {
            localStorage.setItem('anas_admin_logged', 'true');
            document.getElementById('adminAuth').style.display = 'none';
            loadAdminData();
        } else {
            document.getElementById('loginErr').innerText = 'Invalid credentials!';
        }
    }

    function loadAdminData() {
        db.collection('users').onSnapshot(snap => {
            const tb = document.getElementById('usersTable');
            tb.innerHTML = '';
            let count = 0;
            snap.forEach(d => {
                if(d.id === 'anas_admin_99') return;
                count++;
                const u = d.data();
                tb.innerHTML += `<tr><td>${u.name}</td><td>@${u.id}</td><td>${u.status}</td><td><button class="del-btn" onclick="db.collection('users').doc('${d.id}').delete()">Delete</button></td></tr>`;
            });
            document.getElementById('totalUsers').innerText = count;
        });

        db.collection('posts').orderBy('timestamp', 'desc').onSnapshot(snap => {
            const tb = document.getElementById('postsTable');
            tb.innerHTML = '';
            document.getElementById('totalPosts').innerText = snap.size;
            snap.forEach(d => {
                const p = d.data();
                const isHigh = p.highRank === true;
                tb.innerHTML += `
                    <tr>
                        <td>${p.userName}</td>
                        <td>${p.text || '[Image Post]'}</td>
                        <td><span style="color:${isHigh ? '#f59e0b' : '#8696a0'}; font-weight:bold;">${isHigh ? 'High Rank ⭐' : 'Normal'}</span></td>
                        <td>
                            <button class="rank-btn" onclick="togglePostRank('${d.id}', ${!isHigh})">${isHigh ? 'Unrank' : 'Make High Rank'}</button>
                            <button class="del-btn" onclick="db.collection('posts').doc('${d.id}').delete()">Delete</button>
                        </td>
                    </tr>`;
            });
        });
    }

    async function togglePostRank(pId, status) {
        await db.collection('posts').doc(pId).update({ highRank: status });
    }
</script>
</body>
</html>
