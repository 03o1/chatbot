<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anas Chat - Secure Admin Control Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #060913; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }

        /* Login Screen */
        #adminLoginBox { position: fixed; inset: 0; background: #070b14; display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
        .login-card { background: #1e293b; border: 1px solid #334155; padding: 35px; border-radius: 16px; width: 100%; max-width: 380px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); text-align: center; }
        .login-card h2 { color: #f59e0b; margin-bottom: 8px; font-size: 24px; }
        .login-card p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        .form-group { text-align: left; margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 5px; font-weight: 600; }
        .input-field { width: 100%; background: #0f172a; border: 1px solid #334155; color: white; padding: 11px 14px; border-radius: 8px; outline: none; font-size: 14px; }
        .input-field:focus { border-color: #f59e0b; }
        .login-btn { width: 100%; background: #f59e0b; color: #020617; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 5px; transition: 0.2s; }
        .login-btn:hover { background: #d97706; }
        .error-msg { color: #f87171; font-size: 12px; margin-top: 10px; }

        /* Dashboard Header */
        header { background: #0f172a; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
        .logo { font-size: 20px; font-weight: 800; color: #f59e0b; display: flex; align-items: center; gap: 8px; }
        .badge { background: #f59e0b; color: #020617; font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 800; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: bold; }

        /* Dashboard Container */
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; width: 100%; flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        .stat-card { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; gap: 6px; }
        .stat-title { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 28px; font-weight: bold; color: #38bdf8; }

        .table-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .table-header { padding: 18px 20px; background: #131c31; border-bottom: 1px solid #334155; font-size: 16px; font-weight: bold; color: #f8fafc; display: flex; justify-content: space-between; align-items: center; }
        
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { background: rgba(15, 23, 42, 0.6); color: #94a3b8; padding: 12px 20px; font-weight: 600; border-bottom: 1px solid #334155; }
        td { padding: 14px 20px; border-bottom: 1px solid #283548; color: #e2e8f0; }
        tr:hover { background: rgba(255, 255, 255, 0.02); }

        .tag { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; display: inline-block; }
        .tag-active { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .tag-deactivated { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        .btn-action { padding: 6px 12px; border-radius: 6px; border: none; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-right: 4px; }
        .btn-warning { background: #f59e0b; color: #020617; }
        .btn-warning:hover { background: #d97706; }
        .btn-success { background: #10b981; color: #020617; }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
    </style>
</head>
<body>

<!-- ADMIN LOGIN SCREEN -->
<div id="adminLoginBox">
    <div class="login-card">
        <h2>👑 ADMIN PORTAL</h2>
        <p>Enter Master Credentials to Manage Platform</p>
        <div class="form-group">
            <label>Admin Username</label>
            <input type="text" id="adminUser" class="input-field" placeholder="Username">
        </div>
        <div class="form-group">
            <label>Admin Password</label>
            <input type="password" id="adminPass" class="input-field" placeholder="Password">
        </div>
        <button class="login-btn" onclick="adminLogin()">Login to Dashboard</button>
        <div class="error-msg" id="loginError"></div>
    </div>
</div>

<!-- ADMIN DASHBOARD -->
<header>
    <div class="logo">ANAS CHAT <span class="badge">ADMIN DASHBOARD</span></div>
    <button class="logout-btn" onclick="adminLogout()">Log Out</button>
</header>

<div class="container">
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-title">Total Registered Users</div>
            <div class="stat-value" id="totalUsersCount">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">Active Users</div>
            <div class="stat-value" id="activeUsersCount" style="color: #10b981;">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">Blocked / Deactivated</div>
            <div class="stat-value" id="blockedUsersCount" style="color: #ef4444;">0</div>
        </div>
    </div>

    <div class="table-card">
        <div class="table-header">
            <span>Registered Users Database</span>
            <button class="btn-action btn-warning" onclick="loadUsersTable()">🔄 Refresh Data</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Display Name</th>
                    <th>Username (ID)</th>
                    <th>Password / Key</th>
                    <th>Account Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="usersTableBody">
                <!-- Populated via JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Pre-made Admin Credentials
    const MASTER_USER = 'anas_admin_99';
    const MASTER_PASS = 'super_secret_admin_786';

    window.addEventListener('DOMContentLoaded', () => {
        if (localStorage.getItem('anas_admin_logged_in') === 'true') {
            document.getElementById('adminLoginBox').style.display = 'none';
            loadUsersTable();
        }
    });

    function adminLogin() {
        const u = document.getElementById('adminUser').value.trim();
        const p = document.getElementById('adminPass').value.trim();
        const err = document.getElementById('loginError');

        if (u === MASTER_USER && p === MASTER_PASS) {
            localStorage.setItem('anas_admin_logged_in', 'true');
            document.getElementById('adminLoginBox').style.display = 'none';
            loadUsersTable();
        } else {
            err.innerText = 'Invalid Admin Username or Password!';
        }
    }

    function adminLogout() {
        localStorage.removeItem('anas_admin_logged_in');
        location.reload();
    }

    function loadUsersTable() {
        const db = JSON.parse(localStorage.getItem('anas_accounts_db') || '{}');
        const tbody = document.getElementById('usersTableBody');
        tbody.innerHTML = '';

        let total = 0, active = 0, blocked = 0;
        const keys = Object.keys(db);

        keys.forEach(uid => {
            // Skip showing the super admin in user list
            if (uid === MASTER_USER) return;

            total++;
            const usr = db[uid];
            const isDeactivated = (usr.status === 'deactivated');
            if (isDeactivated) blocked++; else active++;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${usr.name}</b></td>
                <td><code>@${uid}</code></td>
                <td><code style="color: #f59e0b; background: rgba(245, 158, 11, 0.1); padding: 3px 6px; border-radius: 4px;">${usr.pass}</code></td>
                <td><span class="tag ${isDeactivated ? 'tag-deactivated' : 'tag-active'}">${isDeactivated ? 'Deactivated' : 'Active'}</span></td>
                <td>
                    <button class="btn-action ${isDeactivated ? 'btn-success' : 'btn-warning'}" onclick="toggleStatus('${uid}')">${isDeactivated ? 'Activate' : 'Deactivate'}</button>
                    <button class="btn-action btn-danger" onclick="deleteUser('${uid}')">Delete</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('totalUsersCount').innerText = total;
        document.getElementById('activeUsersCount').innerText = active;
        document.getElementById('blockedUsersCount').innerText = blocked;
    }

    function toggleStatus(uid) {
        let db = JSON.parse(localStorage.getItem('anas_accounts_db') || '{}');
        if (db[uid]) {
            db[uid].status = (db[uid].status === 'deactivated') ? 'active' : 'deactivated';
            localStorage.setItem('anas_accounts_db', JSON.stringify(db));
            loadUsersTable();
        }
    }

    function deleteUser(uid) {
        if (confirm(`Are you sure you want to permanently delete user @${uid}?`)) {
            let db = JSON.parse(localStorage.getItem('anas_accounts_db') || '{}');
            delete db[uid];
            localStorage.setItem('anas_accounts_db', JSON.stringify(db));
            loadUsersTable();
        }
    }
</script>
</body>
</html>
