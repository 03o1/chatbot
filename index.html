<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anas Chat Social - Pro Cloud Panel</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        :root { --bg-color: #060913; --panel-bg: #0f172a; --card-bg: #1e293b; --accent: #0284c7; --accent-hover: #0369a1; --text: #f8fafc; --text-dim: #94a3b8; --border: #334155; }
        body { background: var(--bg-color); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; transition: background 0.3s; }

        #authOverlay { position: fixed; inset: 0; background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .auth-box { background: var(--card-bg); border: 1px solid var(--border); padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); text-align: center; }
        .auth-box h1 { color: #38bdf8; font-size: 26px; margin-bottom: 5px; }
        .auth-box p { color: var(--text-dim); font-size: 13px; margin-bottom: 20px; }
        
        .auth-tabs { display: flex; background: var(--panel-bg); border-radius: 8px; padding: 4px; margin-bottom: 20px; border: 1px solid var(--border); }
        .auth-tab { flex: 1; padding: 8px; background: none; border: none; color: var(--text-dim); font-weight: bold; font-size: 13px; cursor: pointer; border-radius: 6px; transition: 0.2s; }
        .auth-tab.active { background: var(--accent); color: white; }

        .form-group { text-align: left; margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 5px; font-weight: 600; }
        .auth-input { width: 100%; background: var(--panel-bg); border: 1px solid var(--border); color: white; padding: 11px 14px; border-radius: 8px; outline: none; font-size: 14px; }
        .auth-input:focus { border-color: #38bdf8; }
        .auth-btn { width: 100%; background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 5px; transition: 0.2s; }
        .auth-btn:hover { background: var(--accent-hover); }
        .error-text { color: #f87171; font-size: 12px; margin-top: 10px; min-height: 16px; }

        header { background: var(--panel-bg); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
        .logo { font-size: 18px; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .badge { background: #10b981; color: #020617; font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 800; }
        
        .header-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .user-pill { background: var(--card-bg); padding: 5px 12px; border-radius: 20px; font-size: 12px; border: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
        .ctrl-btn, .logout-btn { background: #334155; color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .logout-btn { background: #ef4444; }

        .app-body { flex: 1; display: flex; overflow: hidden; position: relative; }
        .sidebar { width: 320px; background: var(--panel-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; transition: 0.3s; }
        .tabs { display: flex; border-bottom: 1px solid var(--border); background: #131c31; }
        .tab-btn { flex: 1; padding: 12px 8px; background: none; border: none; color: var(--text-dim); font-size: 12px; font-weight: bold; cursor: pointer; border-bottom: 2px solid transparent; text-align: center; }
        .tab-btn.active { color: #38bdf8; border-bottom-color: #38bdf8; background: rgba(56, 189, 248, 0.05); }

        .list-container { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .user-card { padding: 10px 12px; border-radius: 10px; background: var(--card-bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.2s; }
        .user-card:hover { background: #263349; }
        .user-card.active-chat { background: #0c4a6e; border-color: #38bdf8; }

        .user-left { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
        .u-name { font-size: 13px; font-weight: 600; color: var(--text); }
        .u-id { font-size: 11px; color: var(--text-dim); }
        
        .unread-badge { background: #ef4444; color: white; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 10px; min-width: 18px; text-align: center; }

        .chat-window { flex: 1; display: flex; flex-direction: column; background: rgba(6, 9, 19, 0.85); backdrop-filter: blur(5px); }
        .chat-header { padding: 10px 16px; background: var(--panel-bg); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; min-height: 56px; }
        .active-user-title { font-size: 15px; font-weight: bold; color: var(--text); }
        .back-to-users { display: none; background: #334155; color: white; border: none; padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }

        .messages-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .empty-state { margin: auto; text-align: center; color: var(--text-dim); max-width: 320px; padding: 20px; }
        .empty-state h2 { color: #38bdf8; margin-bottom: 6px; font-size: 18px; }

        .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.4; word-wrap: break-word; }
        .my-msg { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 2px; }
        .peer-msg { align-self: flex-start; background: var(--card-bg); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 2px; }

        .input-bar { padding: 10px 16px; background: var(--panel-bg); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
        .msg-input { flex: 1; background: var(--card-bg); border: 1px solid var(--border); color: white; padding: 10px 14px; border-radius: 8px; outline: none; font-size: 13px; }
        .send-btn { background: var(--accent); color: white; border: none; padding: 0 16px; height: 40px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }

        /* Modals */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border); padding: 24px; border-radius: 12px; width: 100%; max-width: 360px; text-align: center; }
        .modal-content h3 { color: #38bdf8; margin-bottom: 12px; font-size: 18px; }
        .modal-content input { width: 100%; padding: 10px; background: var(--panel-bg); border: 1px solid var(--border); color: white; border-radius: 6px; margin-bottom: 12px; font-size: 13px; }
        .modal-btns { display: flex; gap: 8px; }
        .modal-btns button { flex: 1; padding: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-save { background: #10b981; color: #020617; }
        .btn-close { background: #ef4444; color: white; }

        @media (max-width: 768px) {
            .sidebar { position: absolute; inset: 0; z-index: 10; width: 100%; display: flex; }
            .sidebar.hidden { display: none; }
            .chat-window { width: 100%; }
            .back-to-users { display: inline-block; }
        }
    </style>
</head>
<body>

<div id="authOverlay">
    <div class="auth-box">
        <h1>ANAS CHAT</h1>
        <p>Offline Supported Cloud Portal</p>
        
        <div class="auth-tabs">
            <button class="auth-tab active" id="btnTabSignIn" onclick="switchAuthMode('signin')">Sign In</button>
            <button class="auth-tab" id="btnTabSignUp" onclick="switchAuthMode('signup')">Sign Up</button>
        </div>

        <div id="signUpFields" style="display: none;">
            <div class="form-group">
                <label>Display Name</label>
                <input type="text" id="regName" class="auth-input" placeholder="e.g. Anas Khan">
            </div>
        </div>

        <div class="form-group">
            <label>Username (ID)</label>
            <input type="text" id="regId" class="auth-input" placeholder="e.g. anas786">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="regPass" class="auth-input" placeholder="Password">
        </div>
        
        <button class="auth-btn" id="authSubmitBtn" onclick="handleAuthSubmit()">Sign In</button>
        <div class="error-text" id="authError"></div>
    </div>
</div>

<header>
    <div class="logo">ANAS CHAT <span class="badge">PRO</span></div>
    <div class="header-controls">
        <button class="ctrl-btn" onclick="openProfileModal()">👤 Profile</button>
        <button class="ctrl-btn" onclick="openBgModal()">🎨 Theme</button>
        <div class="user-pill">
            <span id="pillInfo">Connecting...</span>
            <button class="logout-btn" onclick="logoutUser()">Logout</button>
        </div>
    </div>
</header>

<div class="app-body">
    <div class="sidebar" id="sidebarPanel">
        <div class="tabs">
            <button class="tab-btn active">Active Friends</button>
        </div>
        <div class="list-container" id="sidebarList">
            <div style="color:var(--text-dim); text-align:center; padding:20px; font-size:13px;">Loading users...</div>
        </div>
    </div>

    <div class="chat-window">
        <div class="chat-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <button class="back-to-users" onclick="toggleSidebar(true)">← Users</button>
                <div class="active-user-title" id="chatTitle">Select a User to Chat</div>
            </div>
        </div>
        <div class="messages-container" id="messagesContainer">
            <div class="empty-state">
                <h2>Anas Chat Secure</h2>
                <p>Select any user from the list to start real-time messaging.</p>
            </div>
        </div>
        <div class="input-bar">
            <input type="text" id="msgInput" class="msg-input" placeholder="Type a message..." disabled>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>Send</button>
        </div>
    </div>
</div>

<!-- Background Customizer Modal -->
<div class="modal" id="bgModal">
    <div class="modal-content">
        <h3>Change Background</h3>
        <p style="font-size:12px; color:var(--text-dim); margin-bottom:12px;">Color code ya direct Image URL enter karein:</p>
        <input type="text" id="bgInput" placeholder="e.g. #1e1b4b or https://image-url.jpg">
        <div class="modal-btns">
            <button class="btn-save" onclick="applyCustomBg()">Apply</button>
            <button class="btn-close" onclick="closeBgModal()">Cancel</button>
        </div>
    </div>
</div>

<!-- Profile Edit Modal -->
<div class="modal" id="profileModal">
    <div class="modal-content">
        <h3>Edit Profile</h3>
        <div class="form-group">
            <label>New Name</label>
            <input type="text" id="editName" class="auth-input">
        </div>
        <div class="form-group">
            <label>New Password</label>
            <input type="password" id="editPass" class="auth-input" placeholder="New password">
        </div>
        <div class="modal-btns" style="margin-top: 10px;">
            <button class="btn-save" onclick="updateProfileData()">Save</button>
            <button class="btn-close" onclick="closeProfileModal()">Cancel</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyD5FeFjoZOgy5gauNMyogwvsdQHcYGvSEc",
      authDomain: "anaschatdb-6e0af.firebaseapp.com",
      projectId: "anaschatdb-6e0af",
      storageBucket: "anaschatdb-6e0af.firebasestorage.app",
      messagingSenderId: "51927735471",
      appId: "1:51927735471:web:5d95993d3979730c9d485a",
      measurementId: "G-VTFCGDT9KB"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Enable Offline Persistence so app works seamlessly even if offline
    db.enablePersistence({ synchronizeTabs: true }).catch(err => {
        if (err.code == 'unimplemented') {
            console.warn('Browser does not support offline persistence');
        }
    });

    let currentUser = JSON.parse(localStorage.getItem('anas_chat_user')) || null;
    let authMode = 'signin';
    let allUsers = [];
    let selectedUser = null;
    let unreadCounts = {};

    window.onload = () => {
        const savedBg = localStorage.getItem('anas_chat_bg');
        if (savedBg) {
            if (savedBg.startsWith('http')) {
                document.body.style.background = `url('${savedBg}') no-repeat center center fixed`;
                document.body.style.backgroundSize = 'cover';
            } else {
                document.body.style.background = savedBg;
            }
        }

        if (currentUser) {
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('pillInfo').innerText = `@${currentUser.id}`;
            loadUsersFromCloud();
            listenToAllUnreadMessages();
        }
    };

    function openBgModal() { document.getElementById('bgModal').style.display = 'flex'; }
    function closeBgModal() { document.getElementById('bgModal').style.display = 'none'; }
    function openProfileModal() {
        document.getElementById('editName').value = currentUser.name;
        document.getElementById('editPass').value = currentUser.pass;
        document.getElementById('profileModal').style.display = 'flex';
    }
    function closeProfileModal() { document.getElementById('profileModal').style.display = 'none'; }

    async function updateProfileData() {
        const newName = document.getElementById('editName').value.trim();
        const newPass = document.getElementById('editPass').value.trim();
        if (!newName || !newPass) { alert('Fields empty nahi ho sakti!'); return; }

        try {
            await db.collection('users').doc(currentUser.id).update({ name: newName, pass: newPass });
            currentUser.name = newName;
            currentUser.pass = newPass;
            localStorage.setItem('anas_chat_user', JSON.stringify(currentUser));
            document.getElementById('pillInfo').innerText = `@${currentUser.id}`;
            alert('Profile update ho gayi!');
            closeProfileModal();
        } catch (e) {
            alert('Error: ' + e.message);
        }
    }

    function applyCustomBg() {
        const val = document.getElementById('bgInput').value.trim();
        if (!val) return;
        localStorage.setItem('anas_chat_bg', val);
        if (val.startsWith('http')) {
            document.body.style.background = `url('${val}') no-repeat center center fixed`;
            document.body.style.backgroundSize = 'cover';
        } else {
            document.body.style.background = val;
        }
        closeBgModal();
    }

    function toggleSidebar(show) {
        const sb = document.getElementById('sidebarPanel');
        if (show) sb.classList.remove('hidden');
        else sb.classList.add('hidden');
    }

    function switchAuthMode(mode) {
        authMode = mode;
        document.getElementById('btnTabSignIn').className = mode === 'signin' ? 'auth-tab active' : 'auth-tab';
        document.getElementById('btnTabSignUp').className = mode === 'signup' ? 'auth-tab active' : 'auth-tab';
        document.getElementById('signUpFields').style.display = mode === 'signup' ? 'block' : 'none';
        document.getElementById('authSubmitBtn').innerText = mode === 'signin' ? 'Sign In' : 'Sign Up';
        document.getElementById('authError').innerText = '';
    }

    async function handleAuthSubmit() {
        const id = document.getElementById('regId').value.trim().toLowerCase();
        const pass = document.getElementById('regPass').value.trim();
        const name = document.getElementById('regName').value.trim();
        const errEl = document.getElementById('authError');

        if (!id || !pass || (authMode === 'signup' && !name)) {
            errEl.innerText = 'Tamam fields pur karna lazmi hain!';
            return;
        }

        const userRef = db.collection('users').doc(id);

        try {
            if (authMode === 'signup') {
                const doc = await userRef.get();
                if (doc.exists) {
                    errEl.innerText = 'Yeh username pehle se mojood hai!';
                    return;
                }
                const newUser = { id, name, pass, status: 'online' };
                await userRef.set(newUser);
                currentUser = newUser;
            } else {
                const doc = await userRef.get();
                if (!doc.exists) {
                    errEl.innerText = 'Yeh username mojood nahi hai!';
                    return;
                }
                const data = doc.data();
                if (data.pass !== pass) {
                    errEl.innerText = 'Galat password!';
                    return;
                }
                currentUser = data;
                await userRef.update({ status: 'online' });
            }

            localStorage.setItem('anas_chat_user', JSON.stringify(currentUser));
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('pillInfo').innerText = `@${currentUser.id}`;
            loadUsersFromCloud();
            listenToAllUnreadMessages();
        } catch (e) {
            // Fallback for offline cached signin if offline
            if (currentUser && authMode === 'signin') {
                document.getElementById('authOverlay').style.display = 'none';
                loadUsersFromCloud();
            } else {
                errEl.innerText = 'Offline Error / Check details: ' + e.message;
            }
        }
    }

    function logoutUser() {
        if (currentUser) {
            db.collection('users').doc(currentUser.id).update({ status: 'offline' }).finally(() => {
                localStorage.removeItem('anas_chat_user');
                location.reload();
            });
        }
    }

    async function loadUsersFromCloud() {
        db.collection('users').onSnapshot({ includeMetadataChanges: true }, snapshot => {
            allUsers = [];
            snapshot.forEach(doc => {
                if (doc.id !== currentUser.id && doc.id !== 'anas_admin_99') {
                    allUsers.push(doc.data());
                }
            });
            renderUserList();
        });
    }

    function listenToAllUnreadMessages() {
        // Track incoming unread counts dynamically
        db.collection('chats').onSnapshot(snapshot => {
            // Listening to chats where current user is involved
            db.collection('users').get().then(snap => {
                snap.forEach(doc => {
                    const peerId = doc.id;
                    if (peerId !== currentUser.id && peerId !== 'anas_admin_99') {
                        const chatId = [currentUser.id, peerId].sort().join('_');
                        db.collection('chats').doc(chatId).collection('messages')
                          .where('receiver', '==', currentUser.id)
                          .onSnapshot(msgSnap => {
                              let unread = 0;
                              msgSnap.forEach(mDoc => {
                                  if (!mDoc.data().read) unread++;
                              });
                              unreadCounts[peerId] = unread;
                              renderUserList();
                          });
                    }
                });
            });
        });
    }

    function renderUserList() {
        const listEl = document.getElementById('sidebarList');
        listEl.innerHTML = '';
        if (allUsers.length === 0) {
            listEl.innerHTML = `<div style="color:var(--text-dim); text-align:center; padding:20px; font-size:13px;">Abhi koi doosra user nahi hai.</div>`;
            return;
        }

        allUsers.forEach(u => {
            const card = document.createElement('div');
            card.className = `user-card ${selectedUser && selectedUser.id === u.id ? 'active-chat' : ''}`;
            card.onclick = () => {
                selectChatUser(u);
                if (window.innerWidth <= 768) toggleSidebar(false);
            };
            
            const count = unreadCounts[u.id] || 0;
            const badgeHTML = count > 0 ? `<div class="unread-badge">${count}</div>` : '';

            card.innerHTML = `
                <div class="user-left">
                    <div class="avatar">${u.name.charAt(0).toUpperCase()}</div>
                    <div>
                        <div class="u-name">${u.name}</div>
                        <div class="u-id">@${u.id} • <span style="color:${u.status === 'online' ? '#10b981' : '#64748b'}">${u.status}</span></div>
                    </div>
                </div>
                ${badgeHTML}
            `;
            listEl.appendChild(card);
        });
    }

    function selectChatUser(user) {
        selectedUser = user;
        document.getElementById('chatTitle').innerText = `${user.name} (@${user.id})`;
        document.getElementById('msgInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        
        // Mark messages as read when opening chat
        const chatId = [currentUser.id, user.id].sort().join('_');
        db.collection('chats').doc(chatId).collection('messages')
          .where('receiver', '==', currentUser.id).get().then(snap => {
              snap.forEach(d => {
                  d.ref.update({ read: true });
              });
          });
        unreadCounts[user.id] = 0;
        
        renderUserList();
        loadMessages();
    }

    function sendMessage() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text || !selectedUser) return;

        const chatId = [currentUser.id, selectedUser.id].sort().join('_');
        db.collection('chats').doc(chatId).collection('messages').add({
            sender: currentUser.id,
            receiver: selectedUser.id,
            text: text,
            read: false,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        input.value = '';
    }

    function loadMessages() {
        if (!selectedUser) return;
        const chatId = [currentUser.id, selectedUser.id].sort().join('_');
        
        db.collection('chats').doc(chatId).collection('messages')
          .orderBy('timestamp', 'asc')
          .onSnapshot(snapshot => {
              const container = document.getElementById('messagesContainer');
              container.innerHTML = '';
              if (snapshot.empty) {
                  container.innerHTML = `<div style="color:var(--text-dim); text-align:center; margin:auto;">Abhi koi message nahi hua. Pehla message bhejein!</div>`;
                  return;
              }
              snapshot.forEach(doc => {
                  const msg = doc.data();
                  const div = document.createElement('div');
                  div.className = `msg ${msg.sender === currentUser.id ? 'my-msg' : 'peer-msg'}`;
                  div.innerText = msg.text;
                  container.appendChild(div);
              });
              container.scrollTop = container.scrollHeight;
          });
    }
</script>
</body>
</html>
