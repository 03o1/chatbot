<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anas Chat Social - User Panel</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #060913; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        #authOverlay { position: fixed; inset: 0; background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .auth-box { background: #1e293b; border: 1px solid #334155; padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); text-align: center; }
        .auth-box h1 { color: #38bdf8; font-size: 26px; margin-bottom: 5px; letter-spacing: 1px; }
        .auth-box p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        
        .auth-tabs { display: flex; background: #0f172a; border-radius: 8px; padding: 4px; margin-bottom: 20px; border: 1px solid #334155; }
        .auth-tab { flex: 1; padding: 8px; background: none; border: none; color: #94a3b8; font-weight: bold; font-size: 13px; cursor: pointer; border-radius: 6px; transition: 0.2s; }
        .auth-tab.active { background: #0284c7; color: white; }

        .form-group { text-align: left; margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 5px; font-weight: 600; }
        .auth-input { width: 100%; background: #0f172a; border: 1px solid #334155; color: white; padding: 11px 14px; border-radius: 8px; outline: none; font-size: 14px; }
        .auth-input:focus { border-color: #38bdf8; }
        .auth-btn { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 5px; transition: 0.2s; }
        .auth-btn:hover { background: #0369a1; }
        .error-text { color: #f87171; font-size: 12px; margin-top: 10px; min-height: 16px; }

        header { background: #0f172a; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
        .logo { font-size: 19px; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .badge { background: #10b981; color: #020617; font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 800; }
        .user-pill { background: #1e293b; padding: 6px 14px; border-radius: 20px; font-size: 12px; border: 1px solid #334155; display: flex; align-items: center; gap: 10px; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; }

        .app-body { flex: 1; display: flex; overflow: hidden; }
        .sidebar { width: 340px; background: #0f172a; border-right: 1px solid #1e293b; display: flex; flex-direction: column; overflow: hidden; }
        .tabs { display: flex; border-bottom: 1px solid #1e293b; background: #131c31; }
        .tab-btn { flex: 1; padding: 12px 8px; background: none; border: none; color: #94a3b8; font-size: 12px; font-weight: bold; cursor: pointer; border-bottom: 2px solid transparent; text-align: center; position: relative; transition: 0.2s; }
        .tab-btn.active { color: #38bdf8; border-bottom-color: #38bdf8; background: rgba(56, 189, 248, 0.05); }
        .tab-badge { background: #ef4444; color: white; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: 4px; display: none; }

        .list-container { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .user-card { padding: 12px; border-radius: 10px; background: #1e293b; border: 1px solid #283548; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; }
        .user-card.clickable { cursor: pointer; }
        .user-card.clickable:hover { background: #263349; }
        .user-card.active-chat { background: #0c4a6e; border-color: #38bdf8; }

        .user-left { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 38px; height: 38px; border-radius: 50%; background: #0284c7; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 15px; position: relative; flex-shrink: 0; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #10b981; border: 2px solid #1e293b; position: absolute; bottom: 0; right: 0; }
        .status-dot.offline { background: #64748b; }
        .u-name { font-size: 14px; font-weight: 600; color: #f8fafc; }
        .u-id { font-size: 11px; color: #94a3b8; }

        .btn-sm { padding: 6px 12px; border-radius: 6px; border: none; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-add { background: #0284c7; color: white; }
        .btn-sent { background: #334155; color: #94a3b8; cursor: default; }
        .btn-accept { background: #10b981; color: #020617; }
        .btn-reject { background: #ef4444; color: white; margin-left: 4px; }
        .unread-dot { width: 10px; height: 10px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 8px #ef4444; }

        .chat-window { flex: 1; display: flex; flex-direction: column; background: #060913; }
        .chat-header { padding: 12px 20px; background: #0f172a; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; min-height: 62px; }
        .active-user-title { font-size: 16px; font-weight: bold; color: #f8fafc; }
        .typing-status { font-size: 12px; color: #10b981; font-style: italic; height: 16px; }
        .call-btn { background: #10b981; color: #020617; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; display: none; align-items: center; gap: 6px; }
        .call-btn.active { background: #ef4444; color: white; animation: pulse 1.2s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .empty-state { margin: auto; text-align: center; color: #64748b; max-width: 380px; }
        .empty-state h2 { color: #38bdf8; margin-bottom: 8px; font-size: 20px; }

        .msg { max-width: 70%; padding: 11px 15px; border-radius: 14px; font-size: 14px; line-height: 1.45; word-wrap: break-word; }
        .msg-meta { font-size: 10px; opacity: 0.65; margin-top: 4px; text-align: right; }
        .my-msg { align-self: flex-end; background: #0284c7; color: white; border-bottom-right-radius: 2px; }
        .peer-msg { align-self: flex-start; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-bottom-left-radius: 2px; }
        .sys-alert { align-self: center; background: rgba(56, 189, 248, 0.1); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.25); font-size: 12px; padding: 6px 14px; border-radius: 20px; }

        .msg img { max-width: 100%; max-height: 260px; border-radius: 8px; margin-top: 5px; cursor: pointer; display: block; }
        .msg audio { max-width: 230px; height: 35px; margin-top: 5px; }
        .file-box { display: inline-flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 8px; margin-top: 5px; color: white; text-decoration: none; font-size: 13px; border: 1px solid rgba(255,255,255,0.2); }

        .input-bar { padding: 12px 20px; background: #0f172a; border-top: 1px solid #1e293b; display: flex; align-items: center; gap: 10px; }
        .tool-btn { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; width: 40px; height: 40px; border-radius: 8px; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .tool-btn:hover { background: #334155; color: #38bdf8; }
        .tool-btn.rec { background: #ef4444; color: white; animation: pulse 1s infinite; }
        .msg-input { flex: 1; background: #1e293b; border: 1px solid #334155; color: white; padding: 10px 15px; border-radius: 8px; outline: none; font-size: 14px; }
        .msg-input:focus { border-color: #38bdf8; }
        .send-btn { background: #0284c7; color: white; border: none; padding: 0 20px; height: 40px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .send-btn:hover { background: #0369a1; }
    </style>
</head>
<body>

<div id="authOverlay">
    <div class="auth-box">
        <h1>ANAS CHAT</h1>
        <p>User Sign In / Sign Up Panel</p>
        
        <div class="auth-tabs">
            <button class="auth-tab active" id="btnTabSignIn" onclick="switchAuthMode('signin')">Sign In</button>
            <button class="auth-tab" id="btnTabSignUp" onclick="switchAuthMode('signup')">Sign Up</button>
        </div>

        <div id="signUpFields" style="display: none;">
            <div class="form-group">
                <label>Your Display Name</label>
                <input type="text" id="regName" class="auth-input" placeholder="e.g. Anas Khan">
            </div>
        </div>

        <div class="form-group">
            <label>Username (ID)</label>
            <input type="text" id="regId" class="auth-input" placeholder="e.g. anas786">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="regPass" class="auth-input" placeholder="Enter your password">
        </div>
        
        <button class="auth-btn" id="authSubmitBtn" onclick="handleAuthSubmit()">Sign In</button>
        <div class="error-text" id="authError"></div>
    </div>
</div>

<header>
    <div class="logo">ANAS CHAT <span class="badge">USER PANEL</span></div>
    <div class="user-pill">
        <span id="pillInfo">Connecting...</span>
        <button class="logout-btn" onclick="logoutUser()">Logout</button>
    </div>
</header>

<div class="app-body">
    <div class="sidebar">
        <div class="tabs">
            <button class="tab-btn active" id="tabFriends" onclick="switchTab('friends')">Friends <span class="tab-badge" id="badgeFriends">0</span></button>
            <button class="tab-btn" id="tabOnline" onclick="switchTab('online')">Online <span class="tab-badge" id="badgeOnline" style="background:#0284c7; display:inline-block;">0</span></button>
            <button class="tab-btn" id="tabRequests" onclick="switchTab('requests')">Requests <span class="tab-badge" id="badgeRequests">0</span></button>
        </div>

        <div class="list-container" id="sidebarList"></div>
    </div>

    <div class="chat-window">
        <div class="chat-header">
            <div>
                <div class="active-user-title" id="chatTitle">Select a Friend to Chat</div>
                <div class="typing-status" id="typingIndicator"></div>
            </div>
            <button class="call-btn" id="voiceCallBtn" onclick="toggleVoiceCall()">📞 Voice Call</button>
            <audio id="remoteAudio" autoplay></audio>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="empty-state">
                <h2>Welcome to Anas Chat!</h2>
                <p>Go to the <b>Online</b> tab on the left to add friends and start chatting.</p>
            </div>
        </div>

        <div class="input-bar" id="inputBar" style="opacity: 0.4; pointer-events: none;">
            <input type="file" id="imgPicker" accept="image/*" style="display:none" onchange="handleImage(event)">
            <button class="tool-btn" onclick="document.getElementById('imgPicker').click()" title="Send Photo">🖼️</button>
            
            <input type="file" id="filePicker" style="display:none" onchange="handleFile(event)">
            <button class="tool-btn" onclick="document.getElementById('filePicker').click()" title="Send File">📎</button>
            
            <button class="tool-btn" id="micNoteBtn" onclick="toggleVoiceNote()" title="Record Voice Message">🎙️</button>
            
            <input type="text" class="msg-input" id="msgInput" placeholder="Write a message..." oninput="sendTypingSignal()" onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script>
    const BROKER_URL = 'wss://broker.emqx.io:8084/mqtt';
    const TOPIC_ROOT = 'anaschat_social_v4_global_room_9988';

    let mqttClient = null;
    let peer = null;

    let myProfile = { name: '', id: '', pass: '' };
    let authMode = 'signin';
    let currentTab = 'online';
    let activeChatId = null;

    let onlineUsers = {};
    let friends = {};
    let incomingRequests = {};
    let sentRequests = {};
    let chatHistory = {};

    let currentCall = null;
    let localStream = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let typingTimeout = null;

    // Seed default pre-made admin account in localStorage on load
    window.addEventListener('DOMContentLoaded', () => {
        let accountsDB = JSON.parse(localStorage.getItem('anas_accounts_db') || '{}');
        if (!accountsDB['anas_admin_99']) {
            accountsDB['anas_admin_99'] = { name: 'Super Admin', id: 'anas_admin_99', pass: 'super_secret_admin_786', status: 'active' };
            localStorage.setItem('anas_accounts_db', JSON.stringify(accountsDB));
        }

        const saved = localStorage.getItem('anas_social_user_profile');
        const savedFriends = localStorage.getItem('anas_social_friends');
        const savedChats = localStorage.getItem('anas_social_chats');

        if (savedFriends) friends = JSON.parse(savedFriends);
        if (savedChats) chatHistory = JSON.parse(savedChats);

        if (saved) {
            myProfile = JSON.parse(saved);
            document.getElementById('authOverlay').style.display = 'none';
            startPlatform();
        }
    });

    function switchAuthMode(mode) {
        authMode = mode;
        const isUp = (mode === 'signup');
        document.getElementById('btnTabSignIn').classList.toggle('active', !isUp);
        document.getElementById('btnTabSignUp').classList.toggle('active', isUp);
        document.getElementById('signUpFields').style.display = isUp ? 'block' : 'none';
        document.getElementById('authSubmitBtn').innerText = isUp ? 'Sign Up & Create Account' : 'Sign In';
        document.getElementById('authError').innerText = '';
    }

    function handleAuthSubmit() {
        const rawId = document.getElementById('regId').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
        const pass = document.getElementById('regPass').value.trim();
        const errBox = document.getElementById('authError');

        if (!rawId || !pass) { errBox.innerText = 'Please enter Username and Password.'; return; }

        let accountsDB = JSON.parse(localStorage.getItem('anas_accounts_db') || '{}');

        if (authMode === 'signup') {
            const name = document.getElementById('regName').value.trim();
            if (!name) { errBox.innerText = 'Please enter your Display Name.'; return; }
            if (accountsDB[rawId]) { errBox.innerText = 'Username already exists!'; return; }
            
            myProfile = { name, id: rawId, pass, status: 'active' };
            accountsDB[rawId] = myProfile;
            localStorage.setItem('anas_accounts_db', JSON.stringify(accountsDB));
        } else {
            if (!accountsDB[rawId]) { errBox.innerText = 'Account not found!'; return; }
            if (accountsDB[rawId].pass !== pass) { errBox.innerText = 'Incorrect password!'; return; }
            if (accountsDB[rawId].status === 'deactivated') { errBox.innerText = 'Account is deactivated by admin.'; return; }
            myProfile = accountsDB[rawId];
        }

        localStorage.setItem('anas_social_user_profile', JSON.stringify(myProfile));
        document.getElementById('authOverlay').style.display = 'none';
        startPlatform();
    }

    function logoutUser() {
        if (confirm('Are you sure you want to log out?')) {
            localStorage.removeItem('anas_social_user_profile');
            location.reload();
        }
    }

    function startPlatform() {
        document.getElementById('pillInfo').innerHTML = `🟡 Connecting...`;

        peer = new Peer('anaschat_voice_' + myProfile.id);
        peer.on('call', async (call) => {
            const callerId = call.peer.replace('anaschat_voice_', '');
            if (!friends[callerId]) { call.close(); return; }
            openChatWith(callerId);
            appendSystemMsg(callerId, `📞 Incoming voice call from ${friends[callerId].name}...`);
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                call.answer(localStream);
                currentCall = call;
                updateCallBtn(true);
                call.on('stream', (remStream) => { document.getElementById('remoteAudio').srcObject = remStream; });
                call.on('close', cleanupCall);
            } catch (e) {}
        });

        mqttClient = mqtt.connect(BROKER_URL, {
            clientId: 'anas_user_' + myProfile.id + '_' + Math.random().toString(16).substr(2, 4),
            clean: true
        });

        mqttClient.on('connect', () => {
            document.getElementById('pillInfo').innerHTML = `🟢 <b>${myProfile.name}</b> (@${myProfile.id})`;
            mqttClient.subscribe(`${TOPIC_ROOT}/presence`);
            mqttClient.subscribe(`${TOPIC_ROOT}/inbox/${myProfile.id}`);
            broadcastPresence();
            setInterval(broadcastPresence, 4000);
            setInterval(pruneOfflineUsers, 5000);
            switchTab(Object.keys(friends).length > 0 ? 'friends' : 'online');
        });

        mqttClient.on('message', (topic, message) => {
            try {
                const payload = JSON.parse(message.toString());
                if (topic === `${TOPIC_ROOT}/presence`) {
                    if (payload.id !== myProfile.id) {
                        onlineUsers[payload.id] = { name: payload.name, lastSeen: Date.now() };
                        if (friends[payload.id]) friends[payload.id].name = payload.name;
                        renderSidebar();
                    }
                    return;
                }
                if (topic === `${TOPIC_ROOT}/inbox/${myProfile.id}`) { handleInboxPacket(payload); }
            } catch (e) {}
        });
    }

    function broadcastPresence() {
        if (mqttClient && mqttClient.connected) {
            mqttClient.publish(`${TOPIC_ROOT}/presence`, JSON.stringify({ id: myProfile.id, name: myProfile.name }));
        }
    }

    function pruneOfflineUsers() {
        const now = Date.now();
        let changed = false;
        for (let uid in onlineUsers) {
            if (now - onlineUsers[uid].lastSeen > 10000) { delete onlineUsers[uid]; changed = true; }
        }
        if (changed) renderSidebar();
    }

    function sendToUser(targetId, dataObj) {
        if (!mqttClient || !mqttClient.connected) return;
        dataObj.fromId = myProfile.id;
        dataObj.fromName = myProfile.name;
        mqttClient.publish(`${TOPIC_ROOT}/inbox/${targetId}`, JSON.stringify(dataObj));
    }

    function handleInboxPacket(data) {
        const senderId = data.fromId;
        const senderName = data.fromName;

        if (data.type === 'FRIEND_REQ') {
            if (friends[senderId]) { sendToUser(senderId, { type: 'FRIEND_ACCEPT' }); return; }
            incomingRequests[senderId] = { name: senderName };
            renderSidebar();
            return;
        }

        if (data.type === 'FRIEND_ACCEPT') {
            delete sentRequests[senderId];
            friends[senderId] = { name: senderName, unread: false };
            saveFriends();
            appendSystemMsg(senderId, `🎉 ${senderName} accepted your friend request!`);
            renderSidebar();
            return;
        }

        if (data.type === 'TYPING') {
            if (friends[senderId] && activeChatId === senderId) {
                const ind = document.getElementById('typingIndicator');
                ind.innerText = `${friends[senderId].name} is typing...`;
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => { ind.innerText = ''; }, 2000);
            }
            return;
        }

        if (['text', 'image', 'audio', 'file'].includes(data.type)) {
            if (!friends[senderId]) return;
            if (!chatHistory[senderId]) chatHistory[senderId] = [];
            chatHistory[senderId].push({ who: 'peer', type: data.type, content: data.content, fileName: data.fileName || '', time: data.time });
            saveChats();

            if (activeChatId === senderId) {
                renderMessages(senderId);
                document.getElementById('typingIndicator').innerText = '';
            } else {
                friends[senderId].unread = true;
                renderSidebar();
            }
        }
    }

    function sendFriendRequest(targetId) {
        sentRequests[targetId] = true;
        sendToUser(targetId, { type: 'FRIEND_REQ' });
        renderSidebar();
    }

    function acceptRequest(targetId) {
        const req = incomingRequests[targetId];
        if (!req) return;
        friends[targetId] = { name: req.name, unread: false };
        delete incomingRequests[targetId];
        saveFriends();
        sendToUser(targetId, { type: 'FRIEND_ACCEPT' });
        renderSidebar();
        openChatWith(targetId);
        appendSystemMsg(targetId, `🤝 You and ${req.name} are now friends!`);
    }

    function rejectRequest(targetId) { delete incomingRequests[targetId]; renderSidebar(); }

    function switchTab(tabName) {
        currentTab = tabName;
        document.getElementById('tabFriends').classList.toggle('active', tabName === 'friends');
        document.getElementById('tabOnline').classList.toggle('active', tabName === 'online');
        document.getElementById('tabRequests').classList.toggle('active', tabName === 'requests');
        renderSidebar();
    }

    function renderSidebar() {
        const list = document.getElementById('sidebarList');
        list.innerHTML = '';

        document.getElementById('badgeOnline').innerText = Object.keys(onlineUsers).length;
        const reqCount = Object.keys(incomingRequests).length;
        const bReq = document.getElementById('badgeRequests');
        bReq.innerText = reqCount; bReq.style.display = reqCount > 0 ? 'inline-block' : 'none';

        const unreadCount = Object.values(friends).filter(f => f.unread).length;
        const bFr = document.getElementById('badgeFriends');
        bFr.innerText = unreadCount; bFr.style.display = unreadCount > 0 ? 'inline-block' : 'none';

        if (currentTab === 'friends') {
            const fIds = Object.keys(friends);
            if (fIds.length === 0) { list.innerHTML = `<div style="text-align:center; color:#64748b; font-size:13px; margin-top:30px;">No friends yet.</div>`; return; }
            fIds.forEach(uid => {
                const f = friends[uid];
                const isOnline = !!onlineUsers[uid];
                const card = document.createElement('div');
                card.className = 'user-card clickable' + (activeChatId === uid ? ' active-chat' : '');
                card.onclick = () => openChatWith(uid);
                card.innerHTML = `<div class="user-left"><div class="avatar">${f.name.charAt(0).toUpperCase()}<div class="status-dot ${isOnline ? '' : 'offline'}"></div></div><div><div class="u-name">${f.name}</div><div class="u-id">@${uid}</div></div></div>${f.unread ? '<div class="unread-dot"></div>' : ''}`;
                list.appendChild(card);
            });
        }

        if (currentTab === 'online') {
            const uIds = Object.keys(onlineUsers);
            if (uIds.length === 0) { list.innerHTML = `<div style="text-align:center; color:#64748b; font-size:13px; margin-top:30px;">No other users online.</div>`; return; }
            uIds.forEach(uid => {
                const u = onlineUsers[uid];
                const card = document.createElement('div');
                card.className = 'user-card';
                let actionHtml = '';
                if (friends[uid]) actionHtml = `<button class="btn-sm btn-accept" onclick="openChatWith('${uid}')">Chat</button>`;
                else if (incomingRequests[uid]) actionHtml = `<button class="btn-sm btn-accept" onclick="acceptRequest('${uid}')">Accept</button>`;
                else if (sentRequests[uid]) actionHtml = `<button class="btn-sm btn-sent">Sent</button>`;
                else actionHtml = `<button class="btn-sm btn-add" onclick="sendFriendRequest('${uid}')">+ Add</button>`;
                card.innerHTML = `<div class="user-left"><div class="avatar">${u.name.charAt(0).toUpperCase()}<div class="status-dot"></div></div><div><div class="u-name">${u.name}</div><div class="u-id">@${uid}</div></div></div><div>${actionHtml}</div>`;
                list.appendChild(card);
            });
        }

        if (currentTab === 'requests') {
            const rIds = Object.keys(incomingRequests);
            if (rIds.length === 0) { list.innerHTML = `<div style="text-align:center; color:#64748b; font-size:13px; margin-top:30px;">No pending requests.</div>`; return; }
            rIds.forEach(uid => {
                const r = incomingRequests[uid];
                const card = document.createElement('div');
                card.className = 'user-card';
                card.innerHTML = `<div class="user-left"><div class="avatar">${r.name.charAt(0).toUpperCase()}</div><div><div class="u-name">${r.name}</div><div class="u-id">@${uid}</div></div></div><div><button class="btn-sm btn-accept" onclick="acceptRequest('${uid}')">Accept</button><button class="btn-sm btn-reject" onclick="rejectRequest('${uid}')">✕</button></div>`;
                list.appendChild(card);
            });
        }
    }

    function openChatWith(uid) {
        if (!friends[uid]) return;
        activeChatId = uid;
        friends[uid].unread = false;
        saveFriends();
        if (currentTab !== 'friends') switchTab('friends');
        else renderSidebar();

        document.getElementById('chatTitle').innerText = `${friends[uid].name} (@${uid})`;
        document.getElementById('typingIndicator').innerText = '';
        document.getElementById('voiceCallBtn').style.display = 'flex';
        document.getElementById('inputBar').style.opacity = '1';
        document.getElementById('inputBar').style.pointerEvents = 'auto';
        renderMessages(uid);
    }

    function sendTypingSignal() { if (activeChatId && friends[activeChatId]) sendToUser(activeChatId, { type: 'TYPING' }); }

    function dispatchMessage(msgData) {
        if (!activeChatId || !friends[activeChatId]) return;
        msgData.time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        sendToUser(activeChatId, msgData);
        if (!chatHistory[activeChatId]) chatHistory[activeChatId] = [];
        chatHistory[activeChatId].push({ who: 'me', ...msgData });
        saveChats();
        renderMessages(activeChatId);
    }

    function sendMessage() {
        const input = document.getElementById('msgInput');
        const txt = input.value.trim();
        if (!txt) return;
        dispatchMessage({ type: 'text', content: txt });
        input.value = '';
    }

    function handleImage(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => dispatchMessage({ type: 'image', content: reader.result });
        reader.readAsDataURL(file);
    }

    function handleFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => dispatchMessage({ type: 'file', fileName: file.name, content: reader.result });
        reader.readAsDataURL(file);
    }

    async function toggleVoiceNote() {
        const btn = document.getElementById('micNoteBtn');
        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = () => dispatchMessage({ type: 'audio', content: reader.result });
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(t => t.stop());
                };
                mediaRecorder.start();
                isRecording = true;
                btn.classList.add('rec');
            } catch (e) { alert('Mic permission required!'); }
        } else {
            mediaRecorder.stop();
            isRecording = false;
            btn.classList.remove('rec');
        }
    }

    async function toggleVoiceCall() {
        if (!activeChatId || !friends[activeChatId]) return;
        if (!currentCall) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                currentCall = peer.call('anaschat_voice_' + activeChatId, localStream);
                updateCallBtn(true);
                appendSystemMsg(activeChatId, '📞 Calling...');
                currentCall.on('stream', (remStream) => { document.getElementById('remoteAudio').srcObject = remStream; appendSystemMsg(activeChatId, '🟢 Call Connected!'); });
                currentCall.on('close', cleanupCall);
            } catch (e) { alert('Call failed.'); }
        } else {
            currentCall.close();
            cleanupCall();
        }
    }

    function cleanupCall() {
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        currentCall = null;
        updateCallBtn(false);
        if (activeChatId) appendSystemMsg(activeChatId, '📴 Call Ended.');
    }

    function updateCallBtn(isCalling) {
        const btn = document.getElementById('voiceCallBtn');
        btn.classList.toggle('active', isCalling);
        btn.innerText = isCalling ? '📴 End Call' : '📞 Voice Call';
    }

    function renderMessages(uid) {
        const box = document.getElementById('messagesContainer');
        box.innerHTML = '';
        const list = chatHistory[uid] || [];
        list.forEach(m => {
            if (m.type === 'SYS') {
                const s = document.createElement('div');
                s.className = 'sys-alert'; s.innerText = m.content;
                box.appendChild(s); return;
            }
            const div = document.createElement('div');
            div.className = 'msg ' + (m.who === 'me' ? 'my-msg' : 'peer-msg');
            let body = '';
            if (m.type === 'text') body = `<div>${m.content}</div>`;
            else if (m.type === 'image') body = `<img src="${m.content}" onclick="window.open(this.src)">`;
            else if (m.type === 'audio') body = `<audio controls src="${m.content}"></audio>`;
            else if (m.type === 'file') body = `<a href="${m.content}" download="${m.fileName}" class="file-box">📄 ${m.fileName}</a>`;
            div.innerHTML = `${body}<div class="msg-meta">${m.time}</div>`;
            box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
    }

    function appendSystemMsg(uid, text) {
        if (!chatHistory[uid]) chatHistory[uid] = [];
        chatHistory[uid].push({ type: 'SYS', content: text });
        if (activeChatId === uid) renderMessages(uid);
    }

    function saveFriends() { localStorage.setItem('anas_social_friends', JSON.stringify(friends)); }
    function saveChats() { localStorage.setItem('anas_social_chats', JSON.stringify(chatHistory)); }
</script>
</body>
</html>
