<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anas Chat - Social Pro Platform</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        :root { --bg-color: #060913; --panel-bg: rgba(15, 23, 42, 0.95); --card-bg: rgba(30, 41, 59, 0.9); --accent: #0284c7; --accent-hover: #0369a1; --text: #f8fafc; --text-dim: #94a3b8; --border: #334155; }
        body { background-color: var(--bg-color); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; background-size: cover; background-position: center; background-attachment: fixed; box-shadow: inset 0 0 0 2000px rgba(3, 7, 18, 0.7); }

        #authOverlay { position: fixed; inset: 0; background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .auth-box { background: #1e293b; border: 1px solid var(--border); padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); text-align: center; }
        .auth-box h1 { color: #38bdf8; font-size: 26px; margin-bottom: 5px; }
        .auth-box p { color: var(--text-dim); font-size: 13px; margin-bottom: 20px; }
        
        .auth-tabs { display: flex; background: var(--panel-bg); border-radius: 8px; padding: 4px; margin-bottom: 20px; border: 1px solid var(--border); }
        .auth-tab { flex: 1; padding: 8px; background: none; border: none; color: var(--text-dim); font-weight: bold; font-size: 13px; cursor: pointer; border-radius: 6px; transition: 0.2s; }
        .auth-tab.active { background: var(--accent); color: white; }

        .form-group { text-align: left; margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 5px; font-weight: 600; }
        .auth-input { width: 100%; background: #0f172a; border: 1px solid var(--border); color: white; padding: 11px 14px; border-radius: 8px; outline: none; font-size: 14px; }
        .auth-btn { width: 100%; background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 5px; }

        header { background: var(--panel-bg); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
        .logo { font-size: 18px; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .badge { background: #10b981; color: #020617; font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 800; }
        
        .header-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .user-pill { background: rgba(30, 41, 59, 0.95); padding: 5px 12px; border-radius: 20px; font-size: 12px; border: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
        .ctrl-btn, .logout-btn { background: #334155; color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .logout-btn { background: #ef4444; }

        .app-body { flex: 1; display: flex; overflow: hidden; position: relative; }
        .sidebar { width: 340px; background: var(--panel-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        .tabs { display: flex; border-bottom: 1px solid var(--border); background: #131c31; }
        .tab-btn { flex: 1; padding: 12px 8px; background: none; border: none; color: var(--text-dim); font-size: 12px; font-weight: bold; cursor: pointer; border-bottom: 2px solid transparent; text-align: center; }
        .tab-btn.active { color: #38bdf8; border-bottom-color: #38bdf8; background: rgba(56, 189, 248, 0.05); }

        .list-container { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .user-card { padding: 10px 12px; border-radius: 10px; background: var(--card-bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .user-card:hover { background: #263349; }

        .user-left { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .u-name { font-size: 13px; font-weight: 600; color: var(--text); }
        .u-status { font-size: 11px; font-weight: bold; }
        .status-online { color: #10b981; }
        .status-offline { color: #ef4444; }

        .action-chip { padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; border: none; cursor: pointer; }
        .btn-req { background: #0284c7; color: white; }
        .btn-acc { background: #10b981; color: white; }
        .btn-chat { background: #8b5cf6; color: white; }

        /* Main Feed & Chat Area */
        .main-content { flex: 1; display: flex; flex-direction: column; background: rgba(6, 9, 19, 0.5); overflow: hidden; }
        .feed-container { flex: 1; overflow-y: auto; padding: 20px; display: none; flex-direction: column; gap: 16px; max-width: 600px; margin: 0 auto; width: 100%; }
        .feed-container.active { display: flex; }

        .create-post-box { background: var(--card-bg); border: 1px solid var(--border); padding: 15px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px; }
        .create-post-box textarea { width: 100%; background: #0f172a; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 8px; resize: none; height: 70px; outline: none; }
        .post-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .post-header { display: flex; align-items: center; gap: 10px; }
        .post-img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; margin-top: 6px; }
        .post-actions { display: flex; gap: 15px; font-size: 13px; color: var(--text-dim); border-top: 1px solid var(--border); padding-top: 8px; cursor: pointer; }
        .comments-section { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
        .comment-item { background: #0f172a; padding: 6px 10px; border-radius: 6px; font-size: 12px; }

        .chat-area { flex: 1; display: none; flex-direction: column; }
        .chat-area.active { display: flex; }
        .chat-header { padding: 12px 16px; background: var(--panel-bg); border-bottom: 1px solid var(--border); font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .messages-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 13px; word-wrap: break-word; }
        .my-msg { align-self: flex-end; background: var(--accent); color: white; }
        .peer-msg { align-self: flex-start; background: var(--card-bg); border: 1px solid var(--border); }
        .input-bar { padding: 10px 16px; background: var(--panel-bg); border-top: 1px solid var(--border); display: flex; gap: 8px; }
        .msg-input { flex: 1; background: var(--card-bg); border: 1px solid var(--border); color: white; padding: 10px; border-radius: 8px; outline: none; }
        .send-btn { background: var(--accent); color: white; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border); padding: 24px; border-radius: 12px; width: 100%; max-width: 380px; text-align: center; }
        .modal-content input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border); color: white; border-radius: 6px; margin-bottom: 12px; }
    </style>
</head>
<body>

<div id="authOverlay">
    <div class="auth-box">
        <h1>ANAS CHAT</h1>
        <p>Social Community Portal</p>
        <div class="auth-tabs">
            <button class="auth-tab active" id="btnTabSignIn" onclick="switchAuthMode('signin')">Sign In</button>
            <button class="auth-tab" id="btnTabSignUp" onclick="switchAuthMode('signup')">Sign Up</button>
        </div>
        <div id="signUpFields" style="display: none;">
            <div class="form-group"><label>Display Name</label><input type="text" id="regName" class="auth-input"></div>
        </div>
        <div class="form-group"><label>Username ID</label><input type="text" id="regId" class="auth-input"></div>
        <div class="form-group"><label>Password</label><input type="password" id="regPass" class="auth-input"></div>
        <button class="auth-btn" id="authSubmitBtn" onclick="handleAuthSubmit()">Sign In</button>
        <div id="authError" style="color:#f87171; font-size:12px; margin-top:10px;"></div>
    </div>
</div>

<header>
    <div class="logo">ANAS SOCIAL <span class="badge">LIVE</span></div>
    <div class="header-controls">
        <button class="ctrl-btn" onclick="switchView('feed')">📰 News Feed</button>
        <button class="ctrl-btn" onclick="openProfileModal()">👤 Profile</button>
        <button class="ctrl-btn" onclick="openBgModal()">🎨 Theme</button>
        <div class="user-pill"><span id="pillInfo">...</span><button class="logout-btn" onclick="logoutUser()">Logout</button></div>
    </div>
</header>

<div class="app-body">
    <div class="sidebar">
        <div class="tabs">
            <button class="tab-btn active">Community Users</button>
        </div>
        <div class="list-container" id="sidebarList"></div>
    </div>

    <div class="main-content">
        <!-- News Feed View -->
        <div class="feed-container active" id="feedView">
            <div class="create-post-box">
                <textarea id="postText" placeholder="What's on your mind?"></textarea>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <input type="file" id="postImageFile" accept="image/*" style="font-size:11px; color:var(--text-dim);">
                    <button class="action-chip btn-req" onclick="createPost()">Post</button>
                </div>
            </div>
            <div id="postsFeedList" style="display:flex; flex-direction:column; gap:12px;"></div>
        </div>

        <!-- Chat Area View -->
        <div class="chat-area" id="chatAreaView">
            <div class="chat-header" id="chatHeaderTitle">Select a friend to start chatting</div>
            <div class="messages-box" id="messagesContainer">
                <div style="margin:auto; color:var(--text-dim); text-align:center;">Friend request accept hone ke baad chat shuru hogi.</div>
            </div>
            <div class="input-bar">
                <input type="text" id="msgInput" class="msg-input" placeholder="Type a message..." disabled>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>Send</button>
            </div>
        </div>
    </div>
</div>

<!-- Modals -->
<div class="modal" id="bgModal">
    <div class="modal-content">
        <h3>Change Background Theme</h3>
        <input type="text" id="bgInputUrl" placeholder="Image URL">
        <div style="display:flex; gap:8px;"><button class="auth-btn" onclick="applyBg()">Apply</button><button class="auth-btn" style="background:#ef4444;" onclick="closeModal('bgModal')">Cancel</button></div>
    </div>
</div>

<div class="modal" id="profileModal">
    <div class="modal-content">
        <h3>Edit Profile</h3>
        <input type="text" id="editName" placeholder="Name">
        <input type="file" id="editPicFile" accept="image/*" style="margin-bottom:12px; color:var(--text-dim);">
        <input type="password" id="editPass" placeholder="Password">
        <div style="display:flex; gap:8px;"><button class="auth-btn" onclick="updateProfile()">Save</button><button class="auth-btn" style="background:#ef4444;" onclick="closeModal('profileModal')">Cancel</button></div>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyD5FeFjoZOgy5gauNMyogwvsdQHcYGvSEc",
      authDomain: "anaschatdb-6e0af.firebaseapp.com",
      projectId: "anaschatdb-6e0af",
      storageBucket: "anaschatdb-6e0af.firebasestorage.app",
      messagingSenderId: "51927735471",
      appId: "1:51927735471:web:5d95993d3979730c9d485a",
      measurementId: "G-VTFCGDT9KB"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentUser = JSON.parse(localStorage.getItem('anas_social_user')) || null;
    let authMode = 'signin';
    let allUsers = [];
    let friendships = {};
    let selectedChatUser = null;
    let tempPostImg = '', tempProfilePic = '';

    window.onload = () => {
        const savedBg = localStorage.getItem('anas_social_bg');
        if(savedBg) document.body.style.backgroundImage = `url('${savedBg}')`;

        if(currentUser) {
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('pillInfo').innerText = `@${currentUser.id}`;
            initApp();
        }
    };

    function switchAuthMode(mode) {
        authMode = mode;
        document.getElementById('btnTabSignIn').className = mode === 'signin' ? 'auth-tab active' : 'auth-tab';
        document.getElementById('btnTabSignUp').className = mode === 'signup' ? 'auth-tab active' : 'auth-tab';
        document.getElementById('signUpFields').style.display = mode === 'signup' ? 'block' : 'none';
        document.getElementById('authSubmitBtn').innerText = mode === 'signin' ? 'Sign In' : 'Sign Up';
    }

    async function handleAuthSubmit() {
        const id = document.getElementById('regId').value.trim().toLowerCase();
        const pass = document.getElementById('regPass').value.trim();
        const name = document.getElementById('regName').value.trim();
        const err = document.getElementById('authError');
        if(!id || !pass || (authMode === 'signup' && !name)) { err.innerText = 'All fields required!'; return; }

        const ref = db.collection('users').doc(id);
        const doc = await ref.get();

        if(authMode === 'signup') {
            if(doc.exists) { err.innerText = 'Username already exists!'; return; }
            currentUser = { id, name, pass, pic: '', status: 'online' };
            await ref.set(currentUser);
        } else {
            if(!doc.exists) { err.innerText = 'User not found!'; return; }
            currentUser = doc.data();
            if(currentUser.pass !== pass) { err.innerText = 'Wrong password!'; return; }
            await ref.update({ status: 'online' });
        }
        localStorage.setItem('anas_social_user', JSON.stringify(currentUser));
        document.getElementById('authOverlay').style.display = 'none';
        document.getElementById('pillInfo').innerText = `@${currentUser.id}`;
        initApp();
    }

    function logoutUser() {
        if(currentUser) {
            db.collection('users').doc(currentUser.id).update({ status: 'offline' }).finally(() => {
                localStorage.removeItem('anas_social_user');
                location.reload();
            });
        }
    }

    function initApp() {
        loadUsersAndRelations();
        loadFeedPosts();
    }

    function switchView(view) {
        if(view === 'feed') {
            document.getElementById('feedView').classList.add('active');
            document.getElementById('chatAreaView').classList.remove('active');
        }
    }

    function loadUsersAndRelations() {
        db.collection('friendships').onSnapshot(snap => {
            friendships = {};
            snap.forEach(d => { friendships[d.id] = d.data(); });
            db.collection('users').onSnapshot(userSnap => {
                allUsers = [];
                userSnap.forEach(d => {
                    if(d.id !== currentUser.id && d.id !== 'anas_admin_99') allUsers.add ? allUsers.add(d.data()) : allUsers.push(d.data());
                });
                renderSidebar();
            });
        });
    }

    function renderSidebar() {
        const list = document.getElementById('sidebarList');
        list.innerHTML = '';
        allUsers.forEach(u => {
            const pairKey = [currentUser.id, u.id].sort().join('_');
            const rel = friendships[pairKey];
            let actionHTML = '';

            if(!rel) {
                actionHTML = `<button class="action-chip btn-req" onclick="sendRequest('${u.id}')">Add Friend</button>`;
            } else if(rel.status === 'pending') {
                if(rel.sender === currentUser.id) {
                    actionHTML = `<span style="font-size:11px; color:var(--text-dim);">Requested</span>`;
                } else {
                    actionHTML = `<button class="action-chip btn-acc" onclick="acceptRequest('${pairKey}')">Accept</button>`;
                }
            } else if(rel.status === 'accepted') {
                actionHTML = `<button class="action-chip btn-chat" onclick="openChat('${u.id}', '${u.name}')">Chat</button>`;
            }

            const card = document.createElement('div');
            card.className = 'user-card';
            card.innerHTML = `
                <div class="user-left">
                    <div class="avatar">${u.pic ? `<img src="${u.pic}">` : u.name.charAt(0)}</div>
                    <div>
                        <div class="u-name">${u.name}</div>
                        <div class="u-status ${u.status === 'online' ? 'status-online' : 'status-offline'}">${u.status === 'online' ? 'Online' : 'Offline'}</div>
                    </div>
                </div>
                ${actionHTML}
            `;
            list.appendChild(card);
        });
    }

    async function sendRequest(peerId) {
        const pairKey = [currentUser.id, peerId].sort().join('_');
        await db.collection('friendships').doc(pairKey).set({ sender: currentUser.id, receiver: peerId, status: 'pending' });
    }

    async function acceptRequest(pairKey) {
        await db.collection('friendships').doc(pairKey).update({ status: 'accepted' });
    }

    function openChat(peerId, peerName) {
        selectedChatUser = peerId;
        document.getElementById('feedView').classList.remove('active');
        document.getElementById('chatAreaView').classList.add('active');
        document.getElementById('chatHeaderTitle').innerText = `Chat with ${peerName}`;
        document.getElementById('msgInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        loadMessages(peerId);
    }

    function sendMessage() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if(!text || !selectedChatUser) return;
        const chatId = [currentUser.id, selectedChatUser].sort().join('_');
        db.collection('chats').doc(chatId).collection('messages').add({
            sender: currentUser.id, receiver: selectedChatUser, text, timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        input.value = '';
    }

    function loadMessages(peerId) {
        const chatId = [currentUser.id, peerId].sort().join('_');
        db.collection('chats').doc(chatId).collection('messages').orderBy('timestamp', 'asc').onSnapshot(snap => {
            const box = document.getElementById('messagesContainer');
            box.innerHTML = '';
            snap.forEach(d => {
                const m = d.data();
                const div = document.createElement('div');
                div.className = `msg ${m.sender === currentUser.id ? 'my-msg' : 'peer-msg'}`;
                div.innerText = m.text;
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        });
    }

    // Posts & Feed Functions
    document.getElementById('postImageFile').addEventListener('change', e => {
        const f = e.target.files[0];
        if(f) { const r = new FileReader(); r.onload = ev => tempPostImg = ev.target.result; r.readAsDataURL(f); }
    });

    async function createPost() {
        const text = document.getElementById('postText').value.trim();
        if(!text && !tempPostImg) return;
        await db.collection('posts').add({
            userId: currentUser.id, userName: currentUser.name, text, image: tempPostImg, likes: [], timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        document.getElementById('postText').value = '';
        tempPostImg = '';
        document.getElementById('postImageFile').value = '';
    }

    function loadFeedPosts() {
        db.collection('posts').orderBy('timestamp', 'desc').onSnapshot(snap => {
            const list = document.getElementById('postsFeedList');
            list.innerHTML = '';
            snap.forEach(doc => {
                const p = doc.data();
                const pId = doc.id;
                const isLiked = p.likes && p.likes.includes(currentUser.id);

                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <div class="post-header"><strong>${p.userName}</strong></div>
                    <div>${p.text || ''}</div>
                    ${p.image ? `<img src="${p.image}" class="post-img">` : ''}
                    <div class="post-actions">
                        <span onclick="toggleLike('${pId}', ${isLiked})">${isLiked ? '❤️ Liked' : '🤍 Like'} (${p.likes ? p.likes.length : 0})</span>
                    </div>
                    <div class="comments-section" id="comments-${pId}"></div>
                    <div style="display:flex; gap:6px; margin-top:6px;">
                        <input type="text" id="comment-input-${pId}" class="auth-input" placeholder="Write a comment..." style="padding:6px; font-size:12px;">
                        <button class="action-chip btn-req" onclick="addComment('${pId}')">Send</button>
                    </div>
                `;
                list.appendChild(card);
                loadComments(pId);
            });
        });
    }

    async function toggleLike(pId, isLiked) {
        const ref = db.collection('posts').doc(pId);
        if(isLiked) {
            await ref.update({ likes: firebase.firestore.FieldValue.arrayRemove(currentUser.id) });
        } else {
            await ref.update({ likes: firebase.firestore.FieldValue.arrayUnion(currentUser.id) });
        }
    }

    async function addComment(pId) {
        const input = document.getElementById(`comment-input-${pId}`);
        const text = input.value.trim();
        if(!text) return;
        await db.collection('posts').doc(pId).collection('comments').add({
            userId: currentUser.id, userName: currentUser.name, text, timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        input.value = '';
    }

    function loadComments(pId) {
        db.collection('posts').doc(pId).collection('comments').orderBy('timestamp', 'asc').onSnapshot(snap => {
            const box = document.getElementById(`comments-${pId}`);
            box.innerHTML = '';
            snap.forEach(d => {
                const c = d.data();
                const div = document.createElement('div');
                div.className = 'comment-item';
                div.innerHTML = `<strong>${c.userName}:</strong> ${c.text}`;
                box.appendChild(div);
            });
        });
    }

    document.getElementById('editPicFile').addEventListener('change', e => {
        const f = e.target.files[0];
        if(f) { const r = new FileReader(); r.onload = ev => tempProfilePic = ev.target.result; r.readAsDataURL(f); }
    });

    async function updateProfile() {
        const name = document.getElementById('editName').value.trim();
        const pass = document.getElementById('editPass').value.trim();
        if(!name || !pass) return;
        const updateData = { name, pass };
        if(tempProfilePic) updateData.pic = tempProfilePic;
        await db.collection('users').doc(currentUser.id).update(updateData);
        currentUser.name = name; currentUser.pass = pass; if(tempProfilePic) currentUser.pic = tempProfilePic;
        localStorage.setItem('anas_social_user', JSON.stringify(currentUser));
        closeModal('profileModal');
        alert('Profile updated!');
    }

    function applyBg() {
        const url = document.getElementById('bgInputUrl').value.trim();
        if(!url) return;
        localStorage.setItem('anas_social_bg', url);
        document.body.style.backgroundImage = `url('${url}')`;
        closeModal('bgModal');
    }

    function openProfileModal() {
        document.getElementById('editName').value = currentUser.name;
        document.getElementById('editPass').value = currentUser.pass;
        document.getElementById('profileModal').style.display = 'flex';
    }
    function openBgModal() { document.getElementById('bgModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
</script>
</body>
</html>
